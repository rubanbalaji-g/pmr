baseURL = "https://pmr.pedianotes.in/"
locale = "en"
title = "PMR TEST SITE"
paginate = 50
pluralizeListTitles = false

[params]
  description = "High-Yield Pediatric OSCE Stations & Exam Practice"
  author = "Dr. Rubanbalaji"
  siteName = "PMR TEST SITE"
  baseTheme = "dark"
  accentColor = "#f8df3a"
  fontFamily = "system"
  customFontUrl = ""
  obsidianThemeCssUrl = ""
  maxContentWidth = 860
  showSidebar = true
  showTocByDefault = true
  showCreatedTimestamp = true
  showUpdatedTimestamp = true
  timestampFormat = "DD MMM YYYY"
  showNoteIcons = true
  computeBacklinks = true
  generateTagIndex = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = false
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[outputs]
  home = ["HTML", "JSON"]
  page = ["HTML"]
  section = ["HTML"]
